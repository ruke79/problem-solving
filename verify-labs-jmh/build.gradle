// JMH 벤치마크 모듈 — "차이가 없다" 를 주장하는 명제 전용.
//
// 이 저장소의 검증 케이스는 벽시계 측정이라 자릿수 차이만 믿는다(docs/02 §4). 그런데 docs/02 §9-4 의
// 13번(`final` 은 성능과 무관)·14번(람다 vs 익명 클래스는 같다)처럼 **"차이가 없다"** 는 명제는 벽시계로
// 확정할 수 없다 — 잡음이 차이를 덮는지 진짜 없는지 구분이 안 되기 때문이다. 그래서 1판 5장·2판 부록 A 가
// 말하는 대로 JMH(포크·워밍업·Blackhole·오차 범위)를 들이되, §4 의 전제를 바꾸지 않도록 **별도 모듈**로 둔다
// (docs/00 「이어서 할 일」 5번, notes/optimizing-java/00-검토 §7 의 첫 제안).
//
// 실행: ./gradlew :verify-labs-jmh:jmh              (기본 — 짧은 설정, 몇 분)
//       ./gradlew :verify-labs-jmh:jmh -PjmhArgs="FinalField -f 2 -wi 5 -i 5"
// 결과: build/reports/jmh-result.json + 콘솔. README.md 에 실행 결과를 옮겨 적는다.
// CI 에서는 기본으로 돌리지 않는다 — 2코어 공유 러너의 JMH 수치는 문서에 남길 값이 못 된다(workflow_dispatch 로만).
plugins {
    id 'java'
}

dependencies {
    implementation 'org.openjdk.jmh:jmh-core:1.37'
    annotationProcessor 'org.openjdk.jmh:jmh-generator-annprocess:1.37'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.register('jmh', JavaExec) {
    description = 'JMH 벤치마크를 돌린다 (-PjmhArgs="<include regex> <jmh options>")'
    group = 'verification'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'org.openjdk.jmh.Main'
    // 기본은 짧게: 포크 1, 워밍업 3×1s, 측정 5×1s, GC 프로파일러. 결론이 바뀔 만한 벤치마크는 -PjmhArgs 로 늘려 돌린다.
    List<String> defaults = ['-f', '1', '-wi', '3', '-w', '1s', '-i', '5', '-r', '1s', '-prof', 'gc',
                             '-rf', 'json', '-rff', "${buildDir}/reports/jmh-result.json".toString()]
    List<String> extra = project.hasProperty('jmhArgs') ? (project.property('jmhArgs') as String).trim().split(/\s+/) as List : []
    args = extra + defaults
    doFirst {
        file("${buildDir}/reports").mkdirs()
    }
}
