# 검증 랩이 쓰는 인프라: PostgreSQL 16 + Kafka 3.9 (KRaft 단일 노드).
#   docker compose up -d      # 기동
#   ./gradlew :verify-labs:test
#   docker compose down -v    # 정리
#
# 다른 인스턴스를 쓰려면 DB_URL / DB_USERNAME / DB_PASSWORD 환경변수로 덮어쓴다.
#
# 이미지를 못 받으면(Hub 차단·레이트 리밋) 데몬에 미러를 건다:
#   /etc/docker/daemon.json → { "registry-mirrors": ["https://mirror.gcr.io"] }
# 검증 완료: postgres:16 (16.14) 로 52건 전부 실행 — CONFIRMED 50 / REFUTED 0 / INCONCLUSIVE 2
services:
  postgres:
    image: postgres:16
    container_name: verifylab-postgres
    environment:
      POSTGRES_DB: verifylab
      POSTGRES_USER: verifylab
      POSTGRES_PASSWORD: verifylab
    ports:
      - "5432:5432"
    command:
      # DB-06(풀 진단)이 스레드 20개로 커넥션을 동시에 잡는다. 기본값 100 이면 충분하지만
      # 다른 앱과 인스턴스를 공유할 때를 대비해 여유를 준다.
      - "postgres"
      - "-c"
      - "max_connections=200"
      # DB-10(CDC 논리 복제 슬롯)이 요구한다. 기본값 replica 로는 논리 디코딩이 불가능하다.
      - "-c"
      - "wal_level=logical"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verifylab -d verifylab"]
      interval: 3s
      timeout: 3s
      retries: 10

  # verify-labs-kafka 모듈이 쓰는 브로커. KRaft 라 ZooKeeper 가 없다.
  kafka:
    image: apache/kafka:3.9.0
    container_name: verifylab-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # 단일 노드라 복제 계수는 전부 1이어야 한다
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # KAFKA-05(리밸런스)가 컨슈머 합류를 기다리지 않게 한다
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
