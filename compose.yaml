# 검증 랩이 쓰는 인프라: PostgreSQL 16 + Kafka 3.9 (KRaft 단일 노드).
#   docker compose up -d      # 기동
#   ./gradlew :verify-labs:test
#   docker compose down -v    # 정리
#
# 다른 인스턴스를 쓰려면 DB_URL / DB_USERNAME / DB_PASSWORD 환경변수로 덮어쓴다.
#
# 이미지를 못 받으면(Hub 차단·레이트 리밋) 데몬에 미러를 건다:
#   /etc/docker/daemon.json → { "registry-mirrors": ["https://mirror.gcr.io"] }
# 검증 완료: postgres:16 (16.14) 로 52건 전부 실행 — CONFIRMED 50 / REFUTED 0 / INCONCLUSIVE 2
services:
  postgres:
    # pgvector 확장이 포함된 PostgreSQL 16 (AI-07 이 실물 벡터 인덱스를 쓴다)
    image: pgvector/pgvector:pg16
    container_name: verifylab-postgres
    environment:
      POSTGRES_DB: verifylab
      POSTGRES_USER: verifylab
      POSTGRES_PASSWORD: verifylab
    ports:
      # 호스트 포트를 0 으로 두면 도커가 빈 포트를 배정한다(5432 는 이미 떠 있는 경우가 흔하다).
      # `scripts/random-ports.sh` 로 DB_PORT 를 미리 정해 두면 그 값을 쓴다.
      - "${DB_PORT:-0}:5432"
    volumes:
      # 복제 접속 허용 (레플리카가 pg_basebackup 으로 붙는다)
      - ./docker/primary-init:/docker-entrypoint-initdb.d:ro
    command:
      # DB-06(풀 진단)이 스레드 20개로 커넥션을 동시에 잡는다. 기본값 100 이면 충분하지만
      # 다른 앱과 인스턴스를 공유할 때를 대비해 여유를 준다.
      - "postgres"
      - "-c"
      - "max_connections=200"
      # DB-10(CDC 논리 복제 슬롯)이 요구한다. 기본값 replica 로는 논리 디코딩이 불가능하다.
      - "-c"
      - "wal_level=logical"
      # DB-24(복제 지연)용 스트리밍 복제 슬롯
      - "-c"
      - "max_wal_senders=10"
      - "-c"
      - "hot_standby=on"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verifylab -d verifylab"]
      interval: 3s
      timeout: 3s
      retries: 10

  # verify-labs-kafka 모듈이 쓰는 브로커. KRaft 라 ZooKeeper 가 없다.
  kafka:
    image: apache/kafka:3.9.0
    container_name: verifylab-kafka
    ports:
      # Kafka 만은 호스트 포트를 도커에게 맡길 수 없다. 클라이언트는 처음 접속한 뒤
      # 브로커가 알려 주는 advertised listener 주소로 '다시' 접속하기 때문에,
      # 그 주소가 호스트에서 실제로 열린 포트와 같아야 한다.
      # 그래서 포트를 먼저 정해 KAFKA_PORT 로 넘긴다 — `scripts/random-ports.sh` 가 빈 포트를 골라 준다.
      - "${KAFKA_PORT:-9092}:19092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # INTERNAL(9092)  : 도커 네트워크 안에서 쓰는 리스너 — 헬스체크·브로커 간 통신
      # HOST(19092)     : 호스트에서 들어오는 리스너 — 위 ports 매핑의 대상
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,HOST://:19092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,HOST://localhost:${KAFKA_PORT:-9092}
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # 단일 노드라 복제 계수는 전부 1이어야 한다
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # KAFKA-05(리밸런스)가 컨슈머 합류를 기다리지 않게 한다
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20

  # DB-24(복제 지연 / read-your-writes)용 스트리밍 레플리카. 최초 기동 시 pg_basebackup 으로 복제본을 만든다.
  postgres-replica:
    image: pgvector/pgvector:pg16
    container_name: verifylab-postgres-replica
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: verifylab
    user: postgres
    ports:
      - "${REPLICA_PORT:-0}:5432"
    command: >
      bash -c "
      if [ ! -s /var/lib/postgresql/data/PG_VERSION ]; then
        rm -rf /var/lib/postgresql/data/* &&
        pg_basebackup -h postgres -p 5432 -U verifylab -D /var/lib/postgresql/data -Fp -Xs -R &&
        chmod 0700 /var/lib/postgresql/data;
      fi &&
      exec postgres -c max_connections=200 -c hot_standby=on -c recovery_min_apply_delay=2s"
    # 레플리카의 max_connections 는 프라이머리 이상이어야 복구가 시작된다.
    #
    # recovery_min_apply_delay=2s 는 DB-24 를 위한 것이다. 로컬 도커에서는 프라이머리와
    # 레플리카가 같은 호스트라 복제가 수 ms 안에 따라잡아 '쓰기 직후 옛 값이 보인다'는
    # 현상 자체를 관측할 창이 열리지 않는다(실제로 INCONCLUSIVE 가 났다).
    # 이 설정은 WAL 재생을 실제로 2초 늦추는 PostgreSQL 정식 기능이므로,
    # 결과를 조작하는 것이 아니라 실무에서 불규칙하게 일어나는 지연을 관측 가능하게 고정하는 것이다.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verifylab -d verifylab"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Q154(WebSocket 스케일아웃)의 pub/sub 백플레인
  redis:
    image: redis:7-alpine
    container_name: verifylab-redis
    ports:
      # 호스트 포트를 0 으로 두면 도커가 비어 있는 포트를 골라 준다.
      # 6379 는 개발 장비에 이미 떠 있는 경우가 흔해(로컬 Redis, 다른 프로젝트의 compose)
      # 고정하면 `docker compose up` 이 포트 충돌로 실패한다.
      # 실제로 배정된 포트는 `docker compose port redis 6379` 로 확인하며,
      # `./gradlew test` 는 이 값을 자동으로 읽어 REDIS_PORT 로 넘긴다(build.gradle 참고).
      # 특정 포트로 고정하고 싶으면 REDIS_PORT 환경변수를 주면 된다.
      - "${REDIS_PORT:-0}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10
