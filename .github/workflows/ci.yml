# CI — 커밋마다 검증 스위트 전체(110건)를 실물 인프라 위에서 돌린다.
#
# 이 랩의 테스트는 곧 검증이다 — "빌드가 된다"가 아니라 "면접 답변의 명제가 이 환경에서도
# 재현된다"를 확인한다. 그래서 인프라(PostgreSQL 16 + 레플리카 + Kafka + Redis)를 흉내 없이
# compose 로 그대로 띄운다. GitHub 러너는 2코어라 스레드 타이밍 케이스(PERF-09* 등)가
# INCONCLUSIVE 로 남을 수 있고, 그것은 실패가 아니라 정상 결과다(docs/02 §2).
#
# PERF-10C(원격 네트워크)는 여기서 항상 INCONCLUSIVE 다 — 실제 광역 링크가 있어야 단정하는
# 케이스라, 그것을 재려면 remote-network.yml 을 쓴다(docs/02 §9-6).
#
# java-tutorial(54건)·spring-tutorial(52건)은 인프라가 필요 없어 별도 잡으로 먼저 돌린다.
name: ci

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  # 튜토리얼 두 모듈은 인프라가 필요 없다. 그래서 별도 잡으로 먼저 돌린다 —
  # compose 기동을 기다리지 않으므로 몇 분 안에 결과가 나온다.
  tutorial:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: 자바 튜토리얼 (7레슨 54건)
        run: ./gradlew :java-tutorial:test

      - name: 스프링 튜토리얼 (7레슨 52건)
        run: ./gradlew :spring-tutorial:test

      - name: 테스트 상세 (실패 시 진단용)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tutorial-test-results
          path: |
            java-tutorial/build/reports/tests/test/
            spring-tutorial/build/reports/tests/test/

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # 러너에서도 로컬과 같은 절차를 쓴다 — 빈 포트 선택 → compose 기동(헬스체크 대기)
      - name: 인프라 기동
        run: |
          ./scripts/random-ports.sh
          docker compose up -d --wait

      - name: 검증 실행 (110건)
        run: ./gradlew test

      # 판정 리포트가 이 워크플로의 산출물이다 — 실패해도 리포트는 남긴다
      - name: 리포트 수집
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: |
            verify-labs/build/reports/verification.md
            verify-labs-kafka/build/reports/verification-kafka.md
            verify-labs-perfbook/build/reports/verification-perfbook.md
          if-no-files-found: warn

      - name: 테스트 상세 (실패 시 진단용)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/build/reports/tests/test/'
