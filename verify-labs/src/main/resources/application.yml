spring:
  application:
    name: interview-verify-lab

  datasource:
    # PostgreSQL 16 실물을 쓴다. `docker compose up -d` 로 띄우거나(compose.yaml),
    # 로컬/CI 의 다른 인스턴스를 쓰려면 환경변수로 덮어쓴다.
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/verifylab}
    username: ${DB_USERNAME:verifylab}
    password: ${DB_PASSWORD:verifylab}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20        # REQUIRES_NEW 중첩·비관적 락 케이스가 커넥션을 2개 이상 쓴다
      pool-name: lab-pool
      # JPA-07(비관적 락 대기) / DB-07(데드락) 이 영원히 매달리지 않도록 상한을 둔다.
      # H2 의 접속 URL 파라미터 LOCK_TIMEOUT=10000 을 대체하는 설정이다.
      connection-init-sql: SET lock_timeout = '10s'

  jpa:
    open-in-view: false            # JPA-03(LazyInitializationException) 재현에 필수
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        generate_statistics: true  # JPA-01/02/05 의 SQL 수 측정에 필수
        format_sql: false
        session_factory:
          # JPA-06: 실제 발행된 SQL 문자열을 잡아 limit 절 유무를 확인한다
          statement_inspector: io.webboy.verify.labs.jpa.CapturingStatementInspector

  # SEC-* 케이스가 Spring Security 를 쓰지만, 이 랩의 /verify 엔드포인트까지 잠그지는 않는다
  # (실제 보안 설정은 각 케이스가 자기 필터 체인을 직접 만들어 검증한다)
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      # compose.yaml 은 인프라 호스트 포트를 고정하지 않는다(5432·6379 충돌 회피).
      # `./gradlew test` 는 실제 배정된 포트를 감지해 DB_PORT/REPLICA_PORT/REDIS_PORT 로 넘긴다
      # (build.gradle 참고). 앱을 직접 띄울 때는 `docker compose port <서비스> <포트>` 로 확인해 지정한다.
      port: ${REDIS_PORT:6379}

verify:
  enabled: true
  run-on-startup: false            # true 로 두면 기동 직후 전체 검증 + 리포트 저장
  report-path: build/reports/verification.md
  base-path: /verify
  web:
    enabled: true

logging:
  level:
    root: info
    org.hibernate.engine.internal.StatisticalLoggingSessionEventListener: warn
    com.zaxxer.hikari.pool.HikariPool: error   # DB-06 이 일부러 풀을 고갈시킨다
