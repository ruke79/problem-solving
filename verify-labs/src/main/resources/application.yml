spring:
  application:
    name: interview-verify-lab

  datasource:
    # PostgreSQL 16 실물을 쓴다. `docker compose up -d` 로 띄우거나(compose.yaml),
    # 로컬/CI 의 다른 인스턴스를 쓰려면 환경변수로 덮어쓴다.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/verifylab}
    username: ${DB_USERNAME:verifylab}
    password: ${DB_PASSWORD:verifylab}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20        # REQUIRES_NEW 중첩·비관적 락 케이스가 커넥션을 2개 이상 쓴다
      pool-name: lab-pool
      # JPA-07(비관적 락 대기) / DB-07(데드락) 이 영원히 매달리지 않도록 상한을 둔다.
      # H2 의 접속 URL 파라미터 LOCK_TIMEOUT=10000 을 대체하는 설정이다.
      connection-init-sql: SET lock_timeout = '10s'

  jpa:
    open-in-view: false            # JPA-03(LazyInitializationException) 재현에 필수
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        generate_statistics: true  # JPA-01/02/05 의 SQL 수 측정에 필수
        format_sql: false
        session_factory:
          # JPA-06: 실제 발행된 SQL 문자열을 잡아 limit 절 유무를 확인한다
          statement_inspector: io.webboy.verify.labs.jpa.CapturingStatementInspector

verify:
  enabled: true
  run-on-startup: false            # true 로 두면 기동 직후 전체 검증 + 리포트 저장
  report-path: build/reports/verification.md
  base-path: /verify
  web:
    enabled: true

logging:
  level:
    root: info
    org.hibernate.engine.internal.StatisticalLoggingSessionEventListener: warn
    com.zaxxer.hikari.pool.HikariPool: error   # DB-06 이 일부러 풀을 고갈시킨다
