plugins {
    id 'org.springframework.boot'
}

dependencies {
    implementation project(':verify-core')

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-aop'
    implementation 'org.springframework.boot:spring-boot-starter-cache'

    // RES-04: 서킷브레이커는 직접 구현하지 않고 실제 구현체로 검증한다
    implementation 'io.github.resilience4j:resilience4j-circuitbreaker:2.2.0'

    // SEC-01·SEC-02 (Q19): CSRF·XSS 는 흉내내지 않고 실제 Spring Security 필터와 템플릿 엔진으로 검증한다
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    // 케이스가 서블릿 요청/응답을 만들어 실제 필터에 통과시키기 위해 필요하다 (테스트 전용 유틸이지만 케이스가 main 에 있다)
    implementation 'org.springframework:spring-test'

    // GQL-01 (Q11): GraphQL 의 N+1 을 실제 엔진에서 관측한다
    implementation 'org.springframework.boot:spring-boot-starter-graphql'

    // API-04 (Q129): 목이 실제 API 와 어긋나는 상황을 HTTP 레벨에서 재현한다
    implementation 'org.wiremock:wiremock-standalone:3.9.1'

    // RES-11 (Q154): WebSocket 스케일아웃의 pub/sub 백플레인
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    // DB 케이스는 PostgreSQL 16 실물에서 돈다 (compose.yaml 참고)
    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

// RES-11 이 쓰는 Redis 는 compose.yaml 에서 호스트 포트를 도커가 임의로 고르게 해 두었다
// (6379 는 개발 장비에 이미 떠 있는 경우가 흔해 고정하면 기동이 실패한다).
// 그래서 테스트를 띄우기 직전에 실제로 배정된 포트를 물어 REDIS_PORT 로 넘긴다.
// 이 자동 감지가 없으면 "docker compose up -d && ./gradlew test" 한 줄이 깨진다.
tasks.named('test') {
    doFirst {
        if (System.getenv('REDIS_PORT')) {
            return   // 사용자가 직접 지정했으면 그대로 존중한다
        }
        String port = discoverPublishedPort(rootDir, 'redis', 6379)
        if (port == null) {
            // 도커가 없거나 redis 가 안 떠 있는 경우 — RES-11 이 스스로 INCONCLUSIVE 를 남긴다
            logger.lifecycle('Redis 포트를 확인하지 못했다. RES-11 은 INCONCLUSIVE 로 남는다.')
        } else {
            environment 'REDIS_PORT', port
            logger.lifecycle("Redis 호스트 포트 자동 감지: ${port}")
        }
    }
}

/** {@code docker compose port <service> <containerPort>} 의 출력에서 호스트 포트만 뽑는다. */
String discoverPublishedPort(File projectDir, String service, int containerPort) {
    try {
        Process process = new ProcessBuilder('docker', 'compose', 'port', service, containerPort as String)
                .directory(projectDir)
                .redirectErrorStream(true)
                .start()
        String output = process.inputStream.getText('UTF-8')
        if (!process.waitFor(20, java.util.concurrent.TimeUnit.SECONDS) || process.exitValue() != 0) {
            return null
        }
        // 출력 예: 0.0.0.0:32768  (IPv6 까지 여러 줄이 나올 수 있어 첫 유효 줄만 쓴다)
        String line = output.readLines().find { it.contains(':') && it.substring(it.lastIndexOf(':') + 1).isInteger() }
        return line == null ? null : line.substring(line.lastIndexOf(':') + 1).trim()
    } catch (Exception ignored) {
        return null
    }
}
