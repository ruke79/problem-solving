// Java 17 툴체인이 없는 머신에서도 빌드가 되도록 자동 프로비저닝 리졸버를 붙인다.
// (Gradle 8.14 는 툴체인 다운로드 저장소가 설정돼 있지 않으면 곧바로 실패한다)
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'interview-verify-lab'

include 'verify-core'
include 'verify-labs'
include 'verify-labs-kafka'
include 'verify-labs-perfbook'
include 'verify-labs-cloudnative'   // JDK 25 툴체인 — Optimizing Cloud Native Java 2판 명제
include 'verify-labs-jmh'           // JMH 벤치마크 — 벽시계로 확정 못 하는 "차이가 없다" 명제 전용
include 'java-tutorial'
include 'spring-tutorial'
